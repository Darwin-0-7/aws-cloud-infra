name: EKS CI/CD Pipeline

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
 
      - name: Checkout Code
        uses: actions/checkout@v3


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1 

        
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      
      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/my-nginx-app:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-nginx-app:latest

      
      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name darwin-production-cluster --region ap-south-1

  
      - name: Deploy to EKS
        run: |
          kubectl apply -f deployment.yaml
          kubectl rollout restart deployment/nginx-deployment